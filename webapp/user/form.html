<!DOCTYPE html>
<head>
    <title>회원 가입 폼</title>
</head>
<body>
    <form action="/user/create" method="post">
        <table>
            <tr>
                <td>사용자 아이디</td>
            </tr>
            <tr>
                <td><input type="text" id="txtId" name="id" /></td>
            </tr>
            <tr>
                <td>비밀번호</td>
            </tr>
            <tr>
                <td><input type="password" id="txtPwd" name="password"/> </td>
            </tr>
            <tr>
                <td>이름</td>
            </tr>
            <tr>
                <td><input type="text" id="txtName" name="name" /></td>
            </tr>
            <tr>
                <td>이메일</td>
            </tr>
            <tr>
                <td><input type="email" id="txtEmail" name="email" /></td>
            </tr>
        </table><br>
        <button type="submit">가입</button>
    </form>
    
</body>
